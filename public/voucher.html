<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Make a Voucher - CA Research Group</title>
<style>
  body { margin: 0; background: #f1f5f9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #1e293b; }
  .wrap { max-width: 560px; margin: 36px auto; padding: 0 16px; }
  .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 16px; padding: 28px; box-shadow: 0 10px 28px rgba(30,27,75,0.08); }
  .logo { height: 48px; display: block; margin: 0 auto 16px; }
  h1 { font-family: Georgia, serif; color: #1e1b4b; font-size: 24px; margin: 0 0 4px; text-align: center; }
  .sub { text-align: center; color: #64748b; font-size: 14px; margin: 0 0 18px; }
  label { display: block; font-size: 13px; font-weight: bold; color: #1e1b4b; margin: 14px 0 6px; }
  input, textarea { width: 100%; box-sizing: border-box; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 15px; font-family: inherit; }
  textarea { height: 190px; font-size: 14px; line-height: 1.5; }
  button { width: 100%; margin-top: 18px; padding: 14px; background: #1e1b4b; color: #fff; border: 0; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; }
  button.secondary { background: #fff; color: #1e1b4b; border: 1px solid #cbd5e1; margin-top: 10px; }
  button:disabled { background: #94a3b8; cursor: wait; }
  .err { color: #b91c1c; font-size: 14px; text-align: center; margin-top: 12px; }
  .ok { background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 10px; padding: 14px; margin-top: 20px; }
  .ok p { margin: 0 0 8px; font-size: 14px; color: #166534; }
  .link { word-break: break-all; font-size: 13px; color: #1e1b4b; background: #fff; border: 1px solid #e2e8f0; border-radius: 8px; padding: 10px; }
  .hidden { display: none; }
  .note { font-size: 12px; color: #64748b; text-align: center; margin-top: 14px; line-height: 1.5; }
</style>
</head>
<body>
<div class="wrap"><div class="card">
  <img class="logo" src="/logo-tight.png" alt="CA Research Group">
  <h1>Make a Voucher</h1>
  <p class="sub">One free report, good for 5 days. Staff only.</p>

  <form id="f">
    <label for="pw">Staff password</label>
    <input id="pw" type="password" autocomplete="current-password" required>
    <label for="company">Prospect's company</label>
    <input id="company" type="text" placeholder="e.g. Pacific Bridge Lending" required>
    <label for="contact">Contact name</label>
    <input id="contact" type="text" placeholder="e.g. Jane Smith">
    <label for="email">Contact email (their report goes here)</label>
    <input id="email" type="email" placeholder="jane@pacificbridge.com" required>
    <button id="go" type="submit">Make voucher</button>
    <p id="err" class="err hidden"></p>
  </form>

  <div id="done" class="ok hidden">
    <p><strong>Voucher ready.</strong> Good through <span id="exp"></span>.</p>
    <div class="link" id="link"></div>
    <button class="secondary" id="copyLink" type="button">Copy link</button>
    <label for="msg">Ready-to-send message (edit as you like)</label>
    <textarea id="msg"></textarea>
    <button class="secondary" id="copyMsg" type="button">Copy message</button>
    <button class="secondary" id="again" type="button">Make another</button>
  </div>

  <p class="note">Send the link from your own email (william@caresearchgroup.com). The voucher is saved in Airtable &rarr; Customers. To extend it, change its Voucher Expires date there.</p>
</div></div>
<script>
  (function () {
    var $ = function (id) { return document.getElementById(id); };
    function copy(text, btn, label) {
      navigator.clipboard.writeText(text).then(function () { btn.textContent = 'Copied'; setTimeout(function () { btn.textContent = label; }, 1500); }, function () {});
    }
    $('f').addEventListener('submit', function (e) {
      e.preventDefault();
      $('err').classList.add('hidden');
      $('go').disabled = true; $('go').textContent = 'Making voucher...';
      var q = new URLSearchParams({ voucher: '1', token: $('pw').value, company: $('company').value.trim(), contact: $('contact').value.trim(), email: $('email').value.trim() });
      fetch('/api/report-pdf?' + q.toString(), { cache: 'no-store' })
        .then(function (r) { return r.json().then(function (d) { return { status: r.status, d: d }; }); })
        .then(function (x) {
          $('go').disabled = false; $('go').textContent = 'Make voucher';
          if (!x.d.ok) {
            $('err').textContent = x.status === 401 ? 'Wrong staff password.' : (x.d.error || 'Something went wrong.');
            $('err').classList.remove('hidden');
            return;
          }
          var first = ($('contact').value.trim().split(' ')[0]) || 'there';
          $('exp').textContent = x.d.expiresText;
          $('link').textContent = x.d.link;
          $('msg').value = 'Hi ' + first + ',\n\n' +
            'Here is a complimentary CA Research Group report for your next deal. Enter a California property address or business name and you will get a PDF with a sanctions screening and a federal court and bankruptcy search in about a minute:\n\n' +
            x.d.link + '\n\n' +
            'The link is good for one complimentary report through ' + x.d.expiresText + '. One per company. No purchase, credit card, or subscription required.\n\n' +
            'Best,\nBill Alden\nCA Research Group LLC\n1060 Lincoln Ave, Suite 20 #1081\nSan Jose, CA 95125\n\nIf you would rather not hear from me, reply \"no thanks\" or visit caresearchgroup.com/unsubscribe.html and I will not email again.';
          $('copyLink').onclick = function () { copy(x.d.link, $('copyLink'), 'Copy link'); };
          $('copyMsg').onclick = function () { copy($('msg').value, $('copyMsg'), 'Copy message'); };
          $('f').classList.add('hidden');
          $('done').classList.remove('hidden');
        })
        .catch(function () {
          $('go').disabled = false; $('go').textContent = 'Make voucher';
          $('err').textContent = 'Could not reach the server. Please try again.';
          $('err').classList.remove('hidden');
        });
    });
    $('again').addEventListener('click', function () {
      ['company', 'contact', 'email'].forEach(function (k) { $(k).value = ''; });
      $('done').classList.add('hidden'); $('f').classList.remove('hidden');
    });
  })();
</script>
</body>
</html>
