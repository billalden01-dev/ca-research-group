<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex">
<title>Preview: report clock - CA Research Group</title>
<style>
body{margin:0;background:#f1f5f9;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#1e1b4b}
#wait{display:flex;align-items:center;justify-content:center;min-height:100vh;text-align:center}
.k{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:32px 28px;max-width:420px;margin:16px}.k img{height:44px;margin-bottom:18px}
.s{width:38px;height:38px;border:4px solid #e2e8f0;border-top-color:#b8963f;border-radius:50%;margin:0 auto 18px;animation:r 0.9s linear infinite}@keyframes r{to{transform:rotate(360deg)}}
h1{font-family:Georgia,serif;font-size:21px;margin:0 0 8px}
.c{font-family:Georgia,serif;font-size:34px;font-weight:bold;color:#1e1b4b;margin:0 0 10px;font-variant-numeric:tabular-nums}
.k p{color:#475569;margin:0;line-height:1.5}
#done{display:none;flex-direction:column;height:100vh}
.bar{background:#fff;border-bottom:1px solid #e2e8f0;padding:12px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;justify-content:center}
.bar img{height:34px}.bar p{margin:0;font-size:14px;color:#475569;text-align:center}.bar p b{color:#166534}
.dl{display:inline-block;padding:12px 22px;background:#1e1b4b;color:#fff;border-radius:10px;font-size:16px;font-weight:bold;text-decoration:none;white-space:nowrap}
iframe{flex:1;width:100%;border:0;background:#525659}
.note{position:fixed;bottom:0;left:0;right:0;background:#fef3c7;color:#78350f;font-size:13px;padding:8px 12px;text-align:center}
.note a{color:#78350f;font-weight:bold}
</style></head><body>
<div id="wait"><div class="k"><img src="/logo-tight.png" alt="CA Research Group"><div class="s"></div><h1>Building your report</h1>
<div class="c" id="clk">0:00</div>
<p id="msg">Searching several official sources. This usually takes under a minute.</p></div></div>
<div id="done"><div class="bar"><img src="/logo-tight.png" alt="CA Research Group"><p><b id="ready">&#10003; Your report was ready in 22 seconds.</b> It is also in your email. When you're done, you can close this page.</p><a class="dl" href="#">Download PDF</a></div>
<iframe id="v" title="Sample report"></iframe></div>
<div class="note">PREVIEW ONLY (sample report, no charge). <span id="which"></span></div>
<script>
(function(){
  var slow = /slow=1/.test(location.search);
  var startAt = slow ? 40 : 0, finishAt = slow ? 65 : 22;
  document.getElementById('which').innerHTML = slow
    ? 'Slow run (starts at 0:40). <a href="?">See a normal run</a>'
    : 'Normal run (about 22 seconds). <a href="?slow=1">See a slow run</a>';
  var t0 = Date.now() - startAt * 1000, c = document.getElementById('clk'), m = document.getElementById('msg');
  var i = setInterval(function(){
    var s = Math.floor((Date.now() - t0) / 1000);
    if (s >= finishAt) {
      clearInterval(i);
      document.getElementById('ready').innerHTML = '&#10003; ' + (finishAt < 60 ? 'Your report was ready in ' + finishAt + ' seconds.' : 'Your report is ready.');
      document.getElementById('wait').style.display = 'none';
      document.getElementById('done').style.display = 'flex';
      document.getElementById('v').src = '/api/report-pdf?sample=1#toolbar=0&navpanes=0&view=FitH';
      return;
    }
    if (s >= 50) { c.style.display = 'none'; m.textContent = 'Almost done, finishing the last few checks...'; return; }
    c.textContent = '0:' + (s < 10 ? '0' : '') + s;
  }, 250);
})();
</script>
</body></html>
