<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Join the Pilot - CA Research Group</title>
<link rel="icon" href="/favicon.png">
<style>
  body { margin: 0; background: #f1f5f9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #1e293b; }
  .wrap { max-width: 560px; margin: 36px auto; padding: 0 16px; }
  .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 16px; padding: 28px; box-shadow: 0 10px 28px rgba(30,27,75,0.08); }
  .logo { height: 52px; display: block; margin: 0 auto 18px; }
  h1 { font-family: Georgia, serif; color: #1e1b4b; font-size: 26px; margin: 0 0 8px; text-align: center; }
  .lead { text-align: center; color: #475569; font-size: 16px; line-height: 1.6; margin: 0 0 16px; }
  .perk { background: #fbf7ea; border: 2px solid #d6b968; border-radius: 12px; padding: 12px 14px; margin: 0 0 6px; text-align: center; color: #1e1b4b; }
  .perk b { display: block; font-family: Georgia, serif; font-size: 22px; }
  .perk span { display: block; font-size: 14px; color: #6e561c; margin-top: 4px; }
  label { display: block; font-size: 15px; font-weight: bold; color: #1e1b4b; margin: 16px 0 6px; }
  input[type=text], input[type=email], select { width: 100%; box-sizing: border-box; padding: 13px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 16px; background: #fff; }
  .agree { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; color: #1e1b4b; line-height: 1.5; margin-top: 14px; border: 2px solid #e2e8f0; border-radius: 10px; padding: 12px; cursor: pointer; }
  .agree input { margin-top: 3px; transform: scale(1.15); }
  .agree a { color: #1d4ed8; font-weight: bold; }
  button { width: 100%; margin-top: 22px; padding: 15px; background: #1e1b4b; color: #fff; border: 0; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; }
  button:disabled { background: #94a3b8; cursor: wait; }
  .note { font-size: 13px; color: #64748b; text-align: center; margin-top: 14px; line-height: 1.5; }
  .err { color: #b91c1c; font-size: 14px; text-align: center; margin: 12px 0 0; }
  .hp { position: absolute; left: -10000px; width: 1px; height: 1px; overflow: hidden; }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <img class="logo" src="/logo-tight.png" alt="CA Research Group">
    <h1>Join the Free Pilot</h1>
    <p class="lead">Get public-record reports on the businesses behind your deals, in about a minute.</p>
    <div class="perk"><b>5 free reports</b><span>Good through November 20. No credit card needed.</span></div>

    <form id="f" method="post" action="/api/report-pdf">
      <input type="hidden" name="pilot" value="1">
      <input type="hidden" name="code" id="code">
      <div class="hp" aria-hidden="true"><label for="website">Leave this empty</label><input id="website" name="website" tabindex="-1" autocomplete="off"></div>

      <label for="name">Your name</label>
      <input type="text" id="name" name="name" autocomplete="name" maxlength="100" required>

      <label for="company">Your company or brokerage</label>
      <input type="text" id="company" name="company" autocomplete="organization" maxlength="150" placeholder="e.g. Pacific Commercial Realty" required>

      <label for="role">Your role</label>
      <select id="role" name="role">
        <option value="">Select one</option>
        <option value="Commercial real estate broker">Commercial real estate broker or agent</option>
        <option value="Hard money lender or lending institution">Private or hard money lender</option>
        <option value="Real estate investor">Real estate investor</option>
        <option value="Attorney or legal counsel">Attorney or legal counsel</option>
        <option value="Title or escrow company">Title or escrow company</option>
        <option value="Other">Other</option>
      </select>

      <label for="email">Work email (your private link is sent here)</label>
      <input type="email" id="email" name="email" autocomplete="email" maxlength="200" placeholder="name@firm.com" required>

      <label class="agree"><input type="checkbox" name="agreeTerms" value="yes" required><span>I agree to the <a href="/terms.html" target="_blank" rel="noopener">Terms of Service</a> and <a href="/privacy.html" target="_blank" rel="noopener">Privacy Policy</a>.</span></label>
      <label class="agree"><input type="checkbox" name="agreeAccuracy" value="yes" required><span>I understand reports are based on official public records, which may occasionally be incomplete or outdated, and that CA Research Group recommends doing my own due diligence before making any decision.</span></label>

      <button id="go" type="submit">Get my free pilot link</button>
      <p id="err" class="err" hidden></p>
      <p class="note">Your private link is emailed to you right away. Businesses only; we never research individuals.</p>
    </form>
  </div>
</div>
<script>
  (function () {
    var p = new URLSearchParams(location.search);
    document.getElementById('code').value = p.get('code') || '';
    if (!p.get('code')) {
      var e = document.getElementById('err');
      e.textContent = 'Please use the link from your invitation email.';
      e.hidden = false;
      document.getElementById('go').disabled = true;
    }
    document.getElementById('f').addEventListener('submit', function () {
      var b = document.getElementById('go');
      setTimeout(function () { b.disabled = true; b.textContent = 'Setting up your link...'; }, 0);
    });
  })();
</script>
</body>
</html>
